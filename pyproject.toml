[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "syntonal-studio"
version = "0.1.0"
description = "Syntonal Studio: a local composition workspace powered by YuE2"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "psutil>=6,<8",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "numpy==2.2.6"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
